name: Run  Unit Tests (Fast Feedback)

on:
  push:
    branches-ignore:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  issues: read
  pull-requests: write

env:
  MAP_API_BASE_URL_DEVELOPMENT: ${{ vars.MAP_API_BASE_URL_DEVELOPMENT }}
  MAP_API_BASE_URL_PRODUCTION: ${{ vars.MAP_API_BASE_URL_PRODUCTION }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit Tests
        run: ./gradlew testDevelopmentDebugUnitTest --stacktrace

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: 'app/build/test-results/**/*.xml'