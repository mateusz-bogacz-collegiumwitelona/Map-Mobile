name: Pull Request Verification (Full Suite)

on:
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: pr-checks-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  MAP_API_BASE_URL_DEVELOPMENT: ${{ vars.MAP_API_BASE_URL_DEVELOPMENT }}
  MAP_API_BASE_URL_PRODUCTION: ${{ vars.MAP_API_BASE_URL_PRODUCTION }}

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDevelopmentDebugUnitTest --stacktrace

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: "Unit Test Results"
          files: 'app/build/test-results/**/*.xml'

      - name: Upload Unit Test HTML Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDevelopmentDebugUnitTest/

  integration-tests:
    name: Run Instrumented & Integration Tests (Ubuntu KVM)
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD Cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64

      - name: Create AVD and Run Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics -gpu swiftshader_indirect
          disable-animations: true
          channel: stable
          script: ./gradlew connectedDevelopmentDebugAndroidTest --no-daemon --info --stacktrace

      - name: Print Instrumented Test Failures
        if: always()
        run: |
            echo "=== RAPORT ==="
            cat app/build/outputs/androidTest-results/**/TEST-*.xml || true

      - name: Publish Integration Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() 
        with:
          check_name: "Integration / Instrumented Test Results"
          files: 'app/build/outputs/androidTest-results/**/TEST-*.xml'

      - name: Upload Instrumented Test HTML Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-reports
          path: app/build/reports/androidTests/connected/